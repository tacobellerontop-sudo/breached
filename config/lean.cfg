
// ---------------------------------------------------------------------------
// Lean mode (opt-in, PLAN.md section 6). Appended to breached.cfg by
// install.ps1 -Lean. Trades isolation between ordinary sites for less memory:
// only high-value sites (ones you log into, or that ask for isolation) get
// their own processes; everything else shares a small pool.
// ---------------------------------------------------------------------------
defaultPref("fission.webContentIsolationStrategy", 2);         // 1 = isolate every site (default), 2 = high-value sites only
defaultPref("fission.highValue.login.monitor", true);          // detect logins so those sites count as high-value (off on desktop by default)
defaultPref("dom.ipc.processCount", 3);
