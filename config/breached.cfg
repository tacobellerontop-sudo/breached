// Breached preferences. Firefox skips the first line of this file, so keep this comment here.
//
// lockPref:    privacy/telemetry settings the user cannot change from about:config.
// defaultPref: lightweight defaults the user can change in Settings.
// Grouped by the goals in docs/PLAN.md, section 4.

// ---------------------------------------------------------------------------
// 4.1 Unload idle tabs
// ---------------------------------------------------------------------------
defaultPref("browser.sessionstore.restore_on_demand", true);   // restored tabs load only when clicked
defaultPref("browser.tabs.unloadOnLowMemory", true);          // unload tabs when Windows reports low memory
defaultPref("browser.tabs.unloadTabInContextMenu", true);     // "Unload Tab" in the tab right-click menu
defaultPref("browser.sessionstore.interval", 60000);          // save session every 60s instead of 15s (less disk I/O)

// ---------------------------------------------------------------------------
// 4.2 Block page junk (uBlock Origin is installed by policies.json)
// ---------------------------------------------------------------------------
defaultPref("browser.contentblocking.category", "strict");

// ---------------------------------------------------------------------------
// 4.3 Process model (see PLAN.md section 6; Fission site isolation stays on)
// ---------------------------------------------------------------------------
defaultPref("dom.ipc.processPrelaunch.enabled", false);        // no idle spare processes (desktop default keeps up to 3)
defaultPref("dom.ipc.processCount", 4);                        // shared web content processes, Firefox default 8; tune in M1

// ---------------------------------------------------------------------------
// 4.4 Telemetry and vendor services
// ---------------------------------------------------------------------------
// Telemetry and data reporting
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("datareporting.policy.dataSubmissionEnabled", false);
lockPref("datareporting.usage.uploadEnabled", false);
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
lockPref("toolkit.telemetry.archive.enabled", false);
lockPref("toolkit.telemetry.server", "data:,");
lockPref("toolkit.telemetry.newProfilePing.enabled", false);
lockPref("toolkit.telemetry.shutdownPingSender.enabled", false);
lockPref("toolkit.telemetry.firstShutdownPing.enabled", false);
lockPref("toolkit.telemetry.bhrPing.enabled", false);
lockPref("toolkit.coverage.enabled", false);
lockPref("toolkit.coverage.endpoint.base", "");
lockPref("browser.newtabpage.activity-stream.telemetry", false);

// Crash reporting
lockPref("browser.crashReports.unsubmittedCheck.autoSubmit2", false);
lockPref("browser.tabs.crashReporting.sendReport", false);
lockPref("breakpad.reportURL", "");

// Studies and experiments (Normandy, Nimbus)
lockPref("app.normandy.enabled", false);
lockPref("app.normandy.api_url", "");
lockPref("app.shield.optoutstudies.enabled", false);
lockPref("nimbus.rollouts.enabled", false);

// Firefox Accounts / Sync: removed (LX decision); the Firefox Sync mod turns it on
defaultPref("identity.fxaccounts.enabled", false);
// Saved passwords: off; the Password manager mod turns them on
defaultPref("signon.rememberSignons", false);

// Pocket, sponsored content, recommendations
lockPref("browser.newtabpage.activity-stream.showSponsored", false);
lockPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
lockPref("browser.newtabpage.activity-stream.feeds.section.topstories", false);
lockPref("browser.newtabpage.activity-stream.default.sites", "");
lockPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.addons", false);
lockPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.features", false);
lockPref("browser.urlbar.quicksuggest.enabled", false);
lockPref("browser.urlbar.suggest.quicksuggest.sponsored", false);
lockPref("browser.urlbar.suggest.quicksuggest.nonsponsored", false);
lockPref("browser.discovery.enabled", false);
lockPref("extensions.htmlaboutaddons.recommendations.enabled", false);
lockPref("browser.preferences.moreFromMozilla", false);
lockPref("browser.vpn_promo.enabled", false);
lockPref("browser.aboutwelcome.enabled", false);
lockPref("browser.uitour.enabled", false);
defaultPref("browser.search.suggest.enabled", false);          // sends keystrokes to the search engine; user can enable

// AI features (also blocked by the AIControls policy)
defaultPref("browser.ml.enable", false);
defaultPref("browser.ml.chat.enabled", false);
defaultPref("browser.ml.linkPreview.enabled", false);
defaultPref("browser.ml.pageAssist.enabled", false);
defaultPref("browser.tabs.groups.smart.enabled", false);
defaultPref("extensions.ml.enabled", false);

// Safe Browsing: off entirely (LX decision). No list downloads, no lookups.
defaultPref("browser.safebrowsing.malware.enabled", false);
defaultPref("browser.safebrowsing.phishing.enabled", false);
defaultPref("browser.safebrowsing.blockedURIs.enabled", false);
defaultPref("browser.safebrowsing.downloads.enabled", false);
defaultPref("browser.safebrowsing.downloads.remote.enabled", false);

// Background network chatter
defaultPref("network.captive-portal-service.enabled", false);
defaultPref("network.connectivity-service.enabled", false);
defaultPref("network.prefetch-next", false);                   // no downloading pages you may never open
defaultPref("browser.places.speculativeConnect.enabled", false);
defaultPref("browser.urlbar.speculativeConnect.enabled", false);

// Windows helpers that run outside the browser
lockPref("default-browser-agent.enabled", false);              // scheduled task (also blocked by policy)
defaultPref("browser.shell.checkDefaultBrowser", false);

// ---------------------------------------------------------------------------
// 4.5 Fewer helpers and built-ins
// ---------------------------------------------------------------------------
defaultPref("browser.translations.enable", false);             // local ML model in its own process
defaultPref("browser.backup.enabled", false);
defaultPref("browser.backup.scheduled.enabled", false);
defaultPref("browser.profiles.enabled", false);
defaultPref("extensions.webcompat-reporter.enabled", false);   // "Report Broken Site" (WebCompat site fixes stay on)
defaultPref("ui.new-webcompat-reporter.enabled", false);
defaultPref("extensions.formautofill.addresses.enabled", false);
defaultPref("extensions.formautofill.creditCards.enabled", false);

// ---------------------------------------------------------------------------
// Minimal UI (PLAN.md section 4.6). ui/userChrome.css does the rest.
// ---------------------------------------------------------------------------
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true); // load userChrome.css
defaultPref("browser.compactmode.show", true);
defaultPref("browser.uidensity", 1);                           // compact density
defaultPref("browser.toolbars.bookmarks.visibility", "never");
defaultPref("browser.tabs.inTitlebar", 0);                      // normal Windows title bar; tabs live at the bottom
defaultPref("sidebar.visibility", "hide-sidebar");             // no sidebar launcher strip (Ctrl+B still opens bookmarks)

// ---------------------------------------------------------------------------
// 4.6 Speed that costs no memory (LX, 2026-10-17)
// ---------------------------------------------------------------------------
// Connect early: Breached preconnects to the site you're typing in the
// command bar or pressing a link to (shell.js preconnect); pages' own
// preconnect and dns-prefetch hints work too. Needs a non-zero limit.
defaultPref("network.http.speculative-parallel-limit", 6);
defaultPref("network.dns.disablePrefetch", false);
defaultPref("network.dns.disablePrefetchFromHTTPS", false);
// Don't hold back requests a page makes at once (pacing), and allow a few
// more connections to busy sites.
defaultPref("network.http.pacing.requests.enabled", false);
defaultPref("network.http.max-persistent-connections-per-server", 10);
defaultPref("network.http.max-urgent-start-excessive-connections-per-host", 5);
// Remember DNS answers and TLS sessions longer: revisits skip the lookups
// and the full handshake. A few kilobytes.
defaultPref("network.dnsCacheEntries", 1000);
defaultPref("network.dnsCacheExpiration", 3600);
defaultPref("network.ssl_tokens_cache_capacity", 10240);
// Paint a loading page a little sooner (Firefox waits 120 ms).
defaultPref("content.notify.interval", 100000);
// Nothing in Breached uses these background fetches.
defaultPref("extensions.getAddons.cache.enabled", false);
defaultPref("extensions.systemAddon.update.enabled", false);
// The security lists worker (certificate revocations, add-on blocklist) holds
// ~40 MB while it works at startup; let it go after 5 s idle instead of 30 s.
defaultPref("services.settings.worker_idle_max_milliseconds", 5000);
