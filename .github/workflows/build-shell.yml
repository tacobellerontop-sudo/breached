name: Build Breached

# Packages the Breached shell (shell/) on Mozilla's prebuilt Gecko engine for
# Windows, runs the built-in self-test with real key presses, publishes
# screenshots to the ci-screenshots branch, and uploads a portable zip.

on:
  workflow_dispatch:
    inputs:
      mozilla_engine:
        description: "Keep Mozilla's signed engine files as they are (firefox.exe plus a breached.exe launcher)"
        type: boolean
        default: false
  push:
    paths:
      - "shell/**"
      - "config/breached.cfg"
      - "scripts/build/package-shell.ps1"
      - "scripts/build/cfg-to-prefs.py"
      - "scripts/test/**"
      - ".github/workflows/build-shell.yml"

permissions:
  contents: write

concurrency:
  group: build-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The mods the self-test installs, from their own repository.
      - uses: actions/checkout@v4
        with:
          repository: tacobellerontop-sudo/breached-mods
          path: mods-repo

      - name: Download Mozilla's Gecko (Firefox release build)
        shell: pwsh
        run: |
          # The release named in app/firefox-source.txt, or else the newest
          # Windows release of the same major version, or else the newest one.
          $wanted = (Select-String '^version=' app/firefox-source.txt).Line.Split('=')[1]
          $major = $wanted.Split('.')[0]
          $releases = (Invoke-WebRequest https://archive.mozilla.org/pub/firefox/releases/).Links.href |
            ForEach-Object { if ($_ -match '/releases/(\d+\.\d+(\.\d+)?)/$') { $Matches[1] } } |
            Sort-Object -Descending { [version]($_ + ('.0' * (3 - $_.Split('.').Count))) }
          $candidates = @($wanted) + @($releases | Where-Object { $_.Split('.')[0] -eq $major }) + @($releases | Select-Object -First 3)
          foreach ($version in $candidates) {
            $url = "https://archive.mozilla.org/pub/firefox/releases/$version/win64/en-US/Firefox%20Setup%20$version.exe"
            try {
              Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\gecko-setup.exe"
              "Gecko $version (wanted $wanted) from $url"
              exit 0
            } catch { "No Windows build at $url" }
          }
          throw 'no Gecko download found'

      - name: Package Breached
        shell: pwsh
        run: |
          $mozilla = '${{ inputs.mozilla_engine }}' -eq 'true'
          scripts/build/package-shell.ps1 -Installer "$env:RUNNER_TEMP\gecko-setup.exe" -Out out -MozillaEngine:$mozilla

      - name: Self-test
        id: selftest
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = if ('${{ inputs.mozilla_engine }}' -eq 'true') { 'firefox.exe' } else { 'breached.exe' }
          scripts/test/run-selftest.ps1 -App out\breached -Shots screenshots -Exe $exe

      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        shell: bash
        run: |
          mkdir -p screenshots
          cd screenshots
          echo "Run ${{ github.run_id }} for ${{ github.sha }}" > RUN.txt
          git init -q . && git checkout -q -b ci-screenshots
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Screenshots for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots

      - name: Zip
        shell: pwsh
        run: Compress-Archive out\breached breached-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.mozilla_engine && 'breached-win64-mozilla-engine' || 'breached-win64' }}
          path: breached-win64.zip

      - name: Fail if the self-test failed
        if: steps.selftest.outcome == 'failure'
        run: exit 1
