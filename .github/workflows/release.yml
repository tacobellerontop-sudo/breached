name: Release

# Builds a Breached release on Mozilla's own Gecko engine (Firefox's signed
# files, unchanged) with breached.exe as a launcher, the self-test on it,
# a Windows installer (Inno Setup) and a portable zip, then publishes them
# as a GitHub release tagged v<version>.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, like 0.1.0"
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # The mods the self-test installs, from their own repository.
      - uses: actions/checkout@v4
        with:
          repository: tacobellerontop-sudo/breached-mods
          path: mods-repo

      - name: Check the version
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "version must look like 0.1.0, not $env:VERSION" }
          # The app compares this with GitHub's newest release to offer updates.
          $inApp = [regex]::Match((Get-Content -Raw shell/chrome/content/shell.js), 'const BREACHED_VERSION = "([^"]+)"').Groups[1].Value
          if ($inApp -ne $env:VERSION) { throw "shell.js says BREACHED_VERSION = $inApp; set it to $env:VERSION first" }
          gh release view "v$env:VERSION" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "v$env:VERSION is already released" }
          exit 0

      # Breached installs mods (and offers protected video) from this site.
      - name: Check the mods site is up
        shell: pwsh
        run: |
          $mods = (Invoke-RestMethod https://tacobellerontop-sudo.github.io/breached-mods/mods.json).mods
          "Mods site lists: $(($mods | ForEach-Object { "$($_.id) $($_.version)" }) -join ', ')"
          foreach ($id in 'drm', 'bitwarden') {
            Invoke-WebRequest "https://tacobellerontop-sudo.github.io/breached-mods/mods/$id.zip" -Method Head | Out-Null
          }

      # Mozilla's own Firefox build, kept exactly as Mozilla signed it: sites
      # like Netflix only play protected video on engines Google certified.
      - name: Download Mozilla's Gecko (Firefox release build)
        shell: pwsh
        run: |
          # The newest Windows release of the major version in
          # app/firefox-source.txt (security fixes), else the one named there.
          $wanted = (Select-String '^version=' app/firefox-source.txt).Line.Split('=')[1]
          $major = $wanted.Split('.')[0]
          $releases = (Invoke-WebRequest https://archive.mozilla.org/pub/firefox/releases/).Links.href |
            ForEach-Object { if ($_ -match '/releases/(\d+\.\d+(\.\d+)?)/$') { $Matches[1] } } |
            Sort-Object -Descending { [version]($_ + ('.0' * (3 - $_.Split('.').Count))) }
          $candidates = @($releases | Where-Object { $_.Split('.')[0] -eq $major }) + @($wanted)
          foreach ($version in $candidates) {
            $url = "https://archive.mozilla.org/pub/firefox/releases/$version/win64/en-US/Firefox%20Setup%20$version.exe"
            try {
              Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\gecko-setup.exe"
              "Gecko $version from $url"
              "GECKO_VERSION=$version" | Out-File -Append $env:GITHUB_ENV
              exit 0
            } catch { "No Windows build at $url" }
          }
          throw 'no Gecko download found'

      - name: Package Breached
        shell: pwsh
        run: scripts/build/package-shell.ps1 -Installer "$env:RUNNER_TEMP\gecko-setup.exe" -Out out -MozillaEngine

      # breached.exe on its own (no -app): proves the launcher starts the shell.
      - name: Self-test
        shell: pwsh
        run: scripts/test/run-selftest.ps1 -App out\breached -Shots screenshots -NoAppArg

      - name: Check breached.exe's icon and name
        shell: pwsh
        run: |
          $info = (Get-Item out\breached\breached.exe).VersionInfo
          "ProductName: $($info.ProductName), FileDescription: $($info.FileDescription), version $($info.ProductVersion)"
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path out\breached\breached.exe))
          $icon.ToBitmap().Save("$PWD\screenshots\exe-icon.png")

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc /Q "/DAppVersion=$env:VERSION" "/DAppDir=$PWD\out\breached" "/DOutDir=$PWD\release" installer\breached.iss
          if ($LASTEXITCODE) { throw 'Inno Setup failed' }
          Compress-Archive out\breached "release\Breached-$env:VERSION-win64-portable.zip"
          Get-ChildItem release | Select-Object Name, @{n='MB';e={[math]::Round($_.Length / 1MB)}}

      # Install the previous release, then this one over it: the old
      # version's files must be gone, the profile kept. Then uninstall.
      - name: Test the installer
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\Breached"
          $prev = gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName'
          if ($prev) {
            gh release download $prev --pattern 'BreachedSetup-*.exe' --dir prev
            $old = Get-ChildItem prev\BreachedSetup-*.exe | Select-Object -First 1
            $p = Start-Process $old.FullName -PassThru -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART'
            if ($p.ExitCode) { throw "previous installer ($prev) exited with $($p.ExitCode)" }
            Set-Content "$dir\left-over.txt" 'old'
            New-Item -ItemType Directory -Force "$env:APPDATA\Breached" | Out-Null
            Set-Content "$env:APPDATA\Breached\keep.txt" 'profile'
            "Installed $prev first"
          }
          $setup = Get-Item "release\BreachedSetup-$env:VERSION.exe"
          $p = Start-Process $setup.FullName -PassThru -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', "/LOG=$PWD\install.log"
          if ($p.ExitCode) { Get-Content install.log -Tail 30; throw "installer exited with $($p.ExitCode)" }
          if ($prev) {
            if (Test-Path "$dir\left-over.txt") { throw "the previous version's files weren't cleared" }
            if (-not (Test-Path "$env:APPDATA\Breached\keep.txt")) { throw 'the profile was removed' }
            "Upgrade cleared the old files and kept the profile"
          }
          foreach ($f in 'breached.exe', 'firefox.exe', 'xul.dll', 'breached\application.ini', 'unins000.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "installed app has no $f" }
          }
          if (Test-Path "$dir\Breached.bat") { throw 'portable start script was installed' }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter 'Breached.lnk'
          if (-not $lnk) { throw 'no Start menu shortcut' }
          "Installed to $dir, shortcut $($lnk[0].FullName)"
          $u = Start-Process "$dir\unins000.exe" -PassThru -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          Start-Sleep 10
          if (Test-Path "$dir\breached.exe") { throw 'uninstall left breached.exe behind' }
          "Uninstalled (exit $($u.ExitCode))"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-check
          path: |
            screenshots
            install.log

      - name: Publish the GitHub release
        shell: pwsh
        run: |
          $changes = "docs/releases/$env:VERSION.md"
          $notes = @"
          Breached $env:VERSION for Windows 10 and 11 (64-bit), on Mozilla's Gecko engine from Firefox $env:GECKO_VERSION, unchanged.

          - **BreachedSetup-$env:VERSION.exe**: the installer. It installs for you alone without admin rights, or for everyone if you choose that.
          - **Breached-$env:VERSION-win64-portable.zip**: no install. Unzip and run Breached.bat; the profile stays in the profile folder next to it.

          The files aren't code-signed yet, so Windows SmartScreen may say "Windows protected your PC". Choose More info, then Run anyway.

          Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org). [Code signing policy](https://tacobellerontop-sudo.github.io/breached/code-signing.html) · [Privacy policy](https://tacobellerontop-sudo.github.io/breached/privacy.html)

          Built by [this run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) from commit ${{ github.sha }}.
          "@
          $notes = ($notes -split "`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          if (Test-Path $changes) { $notes = (Get-Content -Raw $changes).Trim() + "`n`n" + $notes }
          Set-Content notes.md $notes
          gh release create "v$env:VERSION" (Get-ChildItem release\*).FullName --target ${{ github.sha }} --title "Breached $env:VERSION" --notes-file notes.md
