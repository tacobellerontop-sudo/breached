name: Publish the website

# Publishes site/ to GitHub Pages: https://tacobellerontop-sudo.github.io/breached/
# The page asks the GitHub API for the latest release itself, so new
# releases show up without running this again.

on:
  push:
    branches: [claude/project-thread-cb1l6j]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the script parses
        run: node --check site/site.js
      - name: Stamp the stylesheet and script with this commit, so browsers don't mix a new page with an old cached file
        run: sed -i -E "s/(style\.css|site\.js)\?v=[^\"]*/\1?v=${GITHUB_SHA::8}/g" site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
