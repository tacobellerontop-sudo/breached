<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>login</title>
</head>
<body>
  <!-- Self-test page for the Bitwarden mod: the title shows what was filled. -->
  <form>
    <input id="user" type="text" name="username" autocomplete="username" />
    <input id="pass" type="password" name="password" autocomplete="current-password" />
    <button>log in</button>
  </form>
  <script>
    const show = () => {
      let u = document.getElementById("user").value;
      let p = document.getElementById("pass").value;
      if (u && p) {
        document.title = `filled ${u} / ${p}`;
      }
    };
    document.addEventListener("input", show);
  </script>
</body>
</html>
