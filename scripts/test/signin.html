<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>signin</title>
</head>
<body>
  <!-- Self-test page for the Bitwarden mod, built like Google's sign-in:
       the email first (with a hidden helper password field), then the
       password on a second step of the same page. The title shows the result. -->
  <div id="step1">
    <input id="email" type="email" name="identifier" autocomplete="username webauthn" autofocus />
    <input id="hidden" type="password" name="hiddenPassword" tabindex="-1" aria-hidden="true"
           style="position: absolute; left: -9999px" />
    <button id="next">Next</button>
  </div>
  <script>
    let email = document.getElementById("email");
    let next = () => {
      document.getElementById("step1").hidden = true;
      history.pushState(null, "", "#password");
      let pass = document.createElement("input");
      pass.type = "password";
      pass.name = "Passwd";
      pass.autocomplete = "current-password";
      pass.addEventListener("input", () => {
        if (pass.value) {
          document.title = `signed in ${email.value} / ${pass.value}` + (document.getElementById("hidden").value ? " (hidden field filled)" : "");
        }
      });
      document.body.append(pass);
      pass.focus();
    };
    // Like pressing Next after the email is filled in.
    email.addEventListener("input", () => email.value.includes("-") && setTimeout(next, 500), { once: true });
  </script>
</body>
</html>
