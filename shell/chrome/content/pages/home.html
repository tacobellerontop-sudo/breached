<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Home</title>
  <link rel="stylesheet" href="chrome://breached/content/pages/pages.css" />
  <link rel="stylesheet" href="chrome://breached/content/pages/home.css" />
  <script src="chrome://breached/content/pages/home.js"></script>
</head>
<body>
  <main>
    <h1 id="brand">breached<span id="cursor">_</span></h1>
    <form id="search-form" autocomplete="off">
      <span id="prompt">:open</span>
      <input id="search" type="text" spellcheck="false"
             placeholder="search or type an address" autofocus="autofocus" />
    </form>
    <section id="sites" hidden="hidden">
      <h2 class="muted">most visited</h2>
      <ol id="site-list"></ol>
    </section>
    <footer class="muted">
      <span><kbd>:</kbd> commands</span>
      <span><kbd>Ctrl+T</kbd> new tab</span>
      <span><kbd>Ctrl+W</kbd> close tab</span>
      <span><kbd>Ctrl+,</kbd> <a id="settings-link" href="#">settings</a></span>
    </footer>
  </main>
</body>
</html>
