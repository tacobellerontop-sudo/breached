<?xml version="1.0"?>
<!-- Breached: the whole browser window. Tabs and web pages are added by
     shell.js; everything else is the tab strip, the address bar, and the
     ":" command bar. -->
<!DOCTYPE html>
<html id="breached-window"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      windowtype="breached:main"
      windowsmica="true"
      width="1280" height="800"
      persist="screenX screenY width height sizemode">
<head>
  <meta charset="utf-8" />
  <title>Breached</title>
  <!-- Gecko's base styles for menus and popups (dropdowns, pickers). -->
  <link rel="stylesheet" href="chrome://global/skin/global.css" />
  <link rel="stylesheet" href="chrome://breached/content/shell.css" />
  <script src="chrome://global/content/customElements.js"></script>
  <script src="chrome://breached/content/shell.js"></script>
  <script src="chrome://breached/content/mods.js"></script>
  <script src="chrome://breached/content/addons.js"></script>
  <script src="chrome://breached/content/contextmenu.js"></script>
</head>
<body>
  <!-- Popups pages use: dropdown lists, date and colour pickers, and form
       autocomplete. Gecko adds the first ones here on demand. -->
  <xul:popupset id="mainPopupSet">
    <xul:panel is="autocomplete-richlistbox-popup"
               type="autocomplete-richlistbox"
               id="PopupAutoComplete"
               role="group"
               level="top"
               noautofocus="true"
               hidden="true"
               overflowpadding="4"
               norolluponanchor="true"
               nomaxresults="true" />
  </xul:popupset>
  <div id="titlebar">
    <span id="brand-mark" title="Breached">/</span>
    <div id="titlebar-content">
      <span id="titlebar-title">Breached</span>
    </div>
    <div id="ext-buttons"></div>
    <div id="titlebar-buttons">
      <button id="titlebar-min" class="titlebar-button" title="Minimize" tabindex="-1"></button>
      <button id="titlebar-max" class="titlebar-button" title="Maximize" tabindex="-1"></button>
      <button id="titlebar-restore" class="titlebar-button" title="Restore" tabindex="-1"></button>
      <button id="titlebar-close" class="titlebar-button" title="Close" tabindex="-1"></button>
    </div>
  </div>
  <div id="tabbar" role="tablist">
    <button id="tab-new" class="tab-new" title="New tab (Ctrl+T)" tabindex="-1">+</button>
  </div>
  <div id="toolbar">
    <span id="nav-buttons">
      <button id="nav-back" class="nav-button" title="Back (Alt+Left)" tabindex="-1" disabled="disabled"></button>
      <button id="nav-forward" class="nav-button" title="Forward (Alt+Right)" tabindex="-1" disabled="disabled"></button>
      <button id="nav-reload" class="nav-button" title="Reload (Ctrl+R)" tabindex="-1">&#x21bb;</button>
    </span>
    <span id="address-lock" title="Connection security">&#x2315;</span>
    <input id="addressbar" type="text" spellcheck="false" autocomplete="off"
           placeholder="Search or enter address" />
    <button id="toolbar-menu" class="nav-button" title="Settings (Ctrl+,)" tabindex="-1">&#x22ee;</button>
  </div>
  <div id="content"></div>
  <div id="bottom">
    <div id="message" hidden="hidden"></div>
    <div id="picker" hidden="hidden"></div>
    <div id="commandbar" hidden="hidden">
      <span id="prompt">:</span>
      <input id="commandline" type="text" spellcheck="false" autocomplete="off" />
      <span id="completion"></span>
    </div>
  </div>
</body>
</html>
