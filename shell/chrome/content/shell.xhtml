<?xml version="1.0"?>
<!-- Breached: the whole browser window. Tabs and web pages are added by
     shell.js; everything else is the tab bar and the ":" command bar. -->
<!DOCTYPE html>
<html id="breached-window"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      windowtype="breached:main"
      width="1280" height="800"
      persist="screenX screenY width height sizemode">
<head>
  <meta charset="utf-8" />
  <title>Breached</title>
  <link rel="stylesheet" href="chrome://breached/content/shell.css" />
  <script src="chrome://global/content/customElements.js"></script>
  <script src="chrome://breached/content/shell.js"></script>
</head>
<body>
  <div id="tabbar" role="tablist"></div>
  <div id="content"></div>
  <div id="bottom">
    <div id="message" hidden="hidden"></div>
    <div id="commandbar" hidden="hidden">
      <span id="prompt">:</span>
      <input id="commandline" type="text" spellcheck="false" autocomplete="off" />
      <span id="completion"></span>
    </div>
  </div>
</body>
</html>
