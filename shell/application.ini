; Breached: a small qutebrowser-style shell running on Mozilla's Gecko engine.
; Started by breached.exe (our Gecko build finds this file next to it), or by
; any Gecko 150+ engine with: firefox.exe -app <this folder>\application.ini
[App]
Vendor=Breached
Name=Breached
RemotingName=breached
; Websites see a normal Firefox user agent, so UAName/Version stay Firefox's.
UAName=Firefox
Version=158.0
BuildID=20261015000000
ID=breached@breached.browser
Profile=Breached

[Gecko]
MinVersion=150.0
MaxVersion=*

[XRE]
EnableProfileMigrator=0
